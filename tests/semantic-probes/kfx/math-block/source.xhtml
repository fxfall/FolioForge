  <head><title>Block MathML semantic probe</title><link rel="stylesheet" type="text/css" href="styles.css"/></head>
  <body><main><h1>Block MathML semantic probe</h1>
    <p>Before the equation.</p>
    <math xmlns="http://www.w3.org/1998/Math/MathML" id="formula-1" display="block" alttext="a squared plus b squared equals c squared"><mrow><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><msup><mi>c</mi><mn>2</mn></msup></mrow></math>
    <p>After the equation.</p>
  </main></body>
