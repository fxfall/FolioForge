<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="en">
  <head><title>Footnote basic semantic probe</title><link rel="stylesheet" type="text/css" href="styles.css"/></head>
  <body>
    <main>
      <h1>Footnote basic semantic probe</h1>
      <p>Text with one note<sup><a id="ref-1" epub:type="noteref" href="#note-1">[1]</a></sup>.</p>
      <aside id="note-1" epub:type="footnote">
        <p><a href="#ref-1" epub:type="backlink">↩</a> One source note.</p>
      </aside>
    </main>
  </body>
</html>
