<?xml version="1.0" encoding="utf-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="en">
  <head><title>Endnote semantic probe</title><link rel="stylesheet" type="text/css" href="styles.css"/></head>
  <body>
    <main>
      <h1>Endnote semantic probe</h1>
      <p>Text with an endnote<sup><a id="ref-1" epub:type="noteref" href="#end-1">[1]</a></sup>.</p>
      <section epub:type="endnotes" id="endnotes">
        <h2>Endnotes</h2>
        <aside id="end-1" epub:type="endnote"><p>One source endnote.</p></aside>
      </section>
    </main>
  </body>
</html>
