name: Cross-platform Slint GUI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slint-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-26.04
          - platform: Linux ARM64
            runner: ubuntu-26.04-arm
          - platform: Windows x86_64
            runner: windows-2025
          - platform: Windows ARM64
            runner: windows-11-vs2026-arm
    name: Slint · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Configure external validation directories (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          validation_root="$RUNNER_TEMP/folioforge-validation"
          temp_root="$validation_root/tmp"
          {
            echo "FOLIOFORGE_VALIDATION_ROOT=$validation_root"
            echo "CARGO_TARGET_DIR=$validation_root/cargo-target"
            echo "FOLIOFORGE_TEMP_ROOT=$validation_root/runtime"
            echo "TMPDIR=$temp_root"
            echo "TMP=$temp_root"
            echo "TEMP=$temp_root"
          } >> "$GITHUB_ENV"
          mkdir -p "$validation_root/cargo-target" "$validation_root/runtime" "$temp_root"
      - name: Configure external validation directories (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $validationRoot = Join-Path $env:RUNNER_TEMP 'folioforge-validation'
          $tempRoot = Join-Path $validationRoot 'tmp'
          $runtimeRoot = Join-Path $validationRoot 'runtime'
          $targetRoot = Join-Path $validationRoot 'cargo-target'
          @(
            "FOLIOFORGE_VALIDATION_ROOT=$validationRoot"
            "CARGO_TARGET_DIR=$targetRoot"
            "FOLIOFORGE_TEMP_ROOT=$runtimeRoot"
            "TMPDIR=$tempRoot"
            "TMP=$tempRoot"
            "TEMP=$tempRoot"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path $targetRoot, $runtimeRoot, $tempRoot | Out-Null
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux windowing and font build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config cmake \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinput-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcursor-dev \
            libfontconfig1-dev libfreetype-dev
      - name: Confirm native runner architecture
        shell: bash
        run: |
          rustc -Vv
          cargo -V
          uname -m || true
      - name: Formatting
        if: matrix.runner == 'ubuntu-26.04'
        run: cargo fmt --all -- --check
      - name: Slint static analysis
        run: cargo clippy -p folioforge-slint --all-targets --locked -- -D warnings
      - name: Native Slint release build
        run: cargo build -p folioforge-slint --locked --release
