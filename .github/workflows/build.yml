name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-core:
    name: Linux Core (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - arch: aarch64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      FOLIOFORGE_VALIDATION_ROOT: ${{ runner.temp }}/folioforge-validation
      FOLIOFORGE_CORE_BUILD_ROOT: ${{ runner.temp }}/folioforge-core-build
      FOLIOFORGE_ARTIFACT_ROOT: ${{ runner.temp }}/folioforge-artifacts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Runner and toolchain identity
        run: |
          uname -m
          rustc -Vv
      - name: Build, smoke-test and package Core
        run: |
          sh tests/scripts/package_core_artifact.sh \
            "${{ matrix.target }}" \
            "${{ matrix.label }}" \
            "$FOLIOFORGE_ARTIFACT_ROOT"
      - name: Upload Linux Core artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/folioforge-artifacts/*
          if-no-files-found: error

  windows-core:
    name: Windows Core (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
          - arch: aarch64
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            label: windows-aarch64
    runs-on: ${{ matrix.runner }}
    env:
      FOLIOFORGE_VALIDATION_ROOT: ${{ runner.temp }}\folioforge-validation
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: Runner and toolchain identity
        shell: pwsh
        run: |
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          rustc -Vv
      - name: Build, smoke-test and package Core
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\tests\scripts\package_core_artifact.ps1" `
            -Target "${{ matrix.target }}" `
            -Label "${{ matrix.label }}" `
            -OutputRoot "$env:RUNNER_TEMP\folioforge-artifacts"
      - name: Upload Windows Core artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}\folioforge-artifacts\*
          if-no-files-found: error

  macos-core:
    name: macOS 27 Core (arm64)
    runs-on: xcode-27
    env:
      FOLIOFORGE_VALIDATION_ROOT: ${{ runner.temp }}/folioforge-validation
      FOLIOFORGE_CORE_BUILD_ROOT: ${{ runner.temp }}/folioforge-core-build
      FOLIOFORGE_ARTIFACT_ROOT: ${{ runner.temp }}/folioforge-artifacts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: macOS 27 runner identity
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          rustc -Vv
          test "$(uname -m)" = arm64
      - name: Build, smoke-test and package Core
        run: |
          sh tests/scripts/package_core_artifact.sh \
            aarch64-apple-darwin \
            macos27-aarch64 \
            "$FOLIOFORGE_ARTIFACT_ROOT"
      - name: Upload macOS Core artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-macos-aarch64
          path: ${{ runner.temp }}/folioforge-artifacts/*
          if-no-files-found: error

  macos-gui:
    name: macOS 27 GUI (arm64)
    runs-on: xcode-27
    env:
      FOLIOFORGE_VALIDATION_ROOT: ${{ runner.temp }}/folioforge-validation
      FOLIOFORGE_OUTPUT_ROOT: ${{ runner.temp }}/folioforge-gui-output
      FOLIOFORGE_MACOS_TARGET_VERSION: "27.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
      - name: macOS 27 GUI runner identity
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          rustc -Vv
          test "$(uname -m)" = arm64
      - name: Build GUI release gate
        run: tests/scripts/build_macos_app.sh
      - name: Validate self-contained GUI bundle
        run: |
          app=$(find "$FOLIOFORGE_OUTPUT_ROOT" -type d -name 'FolioForge.app' -print -quit)
          zip=$(find "$FOLIOFORGE_OUTPUT_ROOT" -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$app" -a -n "$zip"
          file "$app/Contents/MacOS/FolioForge" | grep -q 'arm64'
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist" | grep -qx '27.0'
          test -f "$app/Contents/Resources/FolioForge.icns"
          test -f "$app/Contents/Resources/FolioForge_FolioForge.bundle/Contents/Resources/folioforge-logo.png"
          otool -L "$app/Contents/MacOS/FolioForge" | grep -Eq '^[[:space:]]+(/usr/lib|/System/Library)/'
          if otool -L "$app/Contents/MacOS/FolioForge" | sed '1d' | grep -Eq '/Volumes/Repositories|/opt/homebrew|/usr/local/opt|/target/'; then
            exit 1
          fi
          if codesign -dv "$app/Contents/MacOS/FolioForge" >/dev/null 2>&1; then
            echo 'GUI artifact must remain unsigned in the public 0.1 pipeline' >&2
            exit 1
          fi
          ! find "$app" -type f \( -name 'library.sqlite' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit | grep -q .
          unzip -t "$zip"
      - name: Normalize GUI release artifact name
        run: |
          zip=$(find "$FOLIOFORGE_OUTPUT_ROOT" -maxdepth 1 -type f -name '*.zip' -print -quit)
          cp "$zip" "$RUNNER_TEMP/FolioForge-GUI-0.1.0-macos27-aarch64.zip"
      - name: Upload macOS GUI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gui-macos-aarch64
          path: ${{ runner.temp }}/FolioForge-GUI-0.1.0-macos27-aarch64.zip
          if-no-files-found: error

  linux-semantic-parity:
    name: Linux Core semantic parity
    needs: linux-core
    runs-on: ubuntu-26.04
    steps:
      - name: Download Linux Core smoke hashes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: core-linux-*
          path: ${{ runner.temp }}/folioforge-linux-artifacts
          merge-multiple: true
      - name: Compare x86_64 and ARM64 semantic smoke output
        run: |
          x86=$(find "$RUNNER_TEMP/folioforge-linux-artifacts" -name '*linux-x86_64.tar.gz.smoke.semantic.sha256' -print -quit)
          arm=$(find "$RUNNER_TEMP/folioforge-linux-artifacts" -name '*linux-aarch64.tar.gz.smoke.semantic.sha256' -print -quit)
          test -n "$x86" -a -n "$arm"
          test "$(awk '{print $1}' "$x86")" = "$(awk '{print $1}' "$arm")"
