name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-26.04
    steps:
      # actions/checkout v4.2.2; immutable commit verified for the 0.1 baseline.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # dtolnay/rust-toolchain master; immutable commit verified for the 0.1 baseline.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Configure external validation root
        run: |
          validation_root="$RUNNER_TEMP/folioforge-validation"
          {
            echo "FOLIOFORGE_VALIDATION_ROOT=$validation_root"
            echo "CARGO_TARGET_DIR=$validation_root/cargo-target"
            echo "TMPDIR=$validation_root/tmp"
            echo "FOLIOFORGE_TEMP_ROOT=$validation_root/runtime"
            echo "FOLIO_BIN=$validation_root/cargo-target/release/folio"
            echo "FOLIO_SERVICE_BIN=$validation_root/cargo-target/release/folio-service"
          } >> "$GITHUB_ENV"
      - name: Prepare external validation root
        run: mkdir -p "$FOLIOFORGE_VALIDATION_ROOT" "$TMPDIR" "$FOLIOFORGE_TEMP_ROOT"
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --workspace --locked --release
