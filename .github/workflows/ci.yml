name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-26.04
    env:
      FOLIOFORGE_VALIDATION_ROOT: ${{ runner.temp }}/folioforge-validation
      CARGO_TARGET_DIR: ${{ runner.temp }}/folioforge-validation/cargo-target
      TMPDIR: ${{ runner.temp }}/folioforge-validation/tmp
      FOLIOFORGE_TEMP_ROOT: ${{ runner.temp }}/folioforge-validation/runtime
      FOLIO_BIN: ${{ runner.temp }}/folioforge-validation/cargo-target/release/folio
      FOLIO_SERVICE_BIN: ${{ runner.temp }}/folioforge-validation/cargo-target/release/folio-service
    steps:
      # actions/checkout v4.2.2; immutable commit verified for the 0.1 baseline.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # dtolnay/rust-toolchain master; immutable commit verified for the 0.1 baseline.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Prepare external validation root
        run: mkdir -p "$FOLIOFORGE_VALIDATION_ROOT" "$TMPDIR" "$FOLIOFORGE_TEMP_ROOT"
      - name: Repository clean gate
        run: python3 tools/release/repository-audit.py
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Architecture boundary gate
        run: python3 tests/architecture/check_boundaries.py
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Release build
        run: cargo build --workspace --locked --release
      - name: Public semantic probes
        run: |
          python3 tools/dev/kfx_probe.py validate --all \
            --artifact-root "$FOLIOFORGE_VALIDATION_ROOT/kfx-probes"
      - name: Public conversion matrix
        run: |
          tests/scripts/run_degradation_golden.sh
          tests/scripts/run_conversion_matrix.sh
          tests/scripts/run_service_smoke.sh
